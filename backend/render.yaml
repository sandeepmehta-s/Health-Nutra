services:
  # -------------------------------------------------------------
  # Health Nutra - Fullstack Web Service on Render
  # Hosts Storefront, Tailwind UI, Admin Portal, REST APIs & Keep-Alive Cron
  # -------------------------------------------------------------
  - type: web
    name: health-nutra
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: 5000
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: PING_INTERVAL_MINUTES
        value: 5
      - key: CLOUDINARY_CLOUD_NAME
        value: usqwgkl7
      - key: CLOUDINARY_API_KEY
        value: 173632714251558
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: BRAND_LOGO_URL
        value: https://res.cloudinary.com/usqwgkl7/image/upload/v1792576055/logo.jpg

